[project]
name = "secret-rotator"
version = "0.1.0"
description = "Automated OpenBao secret rotation for the homelab"
authors = [{ name = "Pieter van Ginkel", email = "pvginkel@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "pyyaml (>=6.0,<7)",
    "psycopg[binary] (>=3.2,<4)",
    "textual (>=8.2,<8.3)",
    "cryptography (>=46,<47)"
]

[project.scripts]
secret-rotator = "secret_rotator.cli:main"

# One package per kind (design §6, plugin contract): the registry finds them here.
[project.entry-points."secret_rotator.kinds"]
random = "secret_rotator.kinds.random:Random"
manual = "secret_rotator.kinds.manual:Manual"
approle = "secret_rotator.kinds.approle:AppRole"
keycloak-client = "secret_rotator.kinds.keycloak_client:KeycloakClient"
cnpg-role = "secret_rotator.kinds.cnpg_role:CnpgRole"
jenkins-token = "secret_rotator.kinds.jenkins_token:JenkinsToken"
jenkins-job-token = "secret_rotator.kinds.jenkins_job_token:JenkinsJobToken"
grafana-admin = "secret_rotator.kinds.grafana_admin:GrafanaAdmin"
pve-root-password = "secret_rotator.kinds.pve_root_password:PveRootPassword"
samba-user = "secret_rotator.kinds.samba_user:SambaUser"
step-ca-password = "secret_rotator.kinds.step_ca_password:StepCaPassword"
github-webhook-secret = "secret_rotator.kinds.github_webhook_secret:GitHubWebhookSecret"
youtrack-token = "secret_rotator.kinds.youtrack_token:YouTrackToken"
home-assistant-token = "secret_rotator.kinds.home_assistant_token:HomeAssistantToken"
google-sa-key = "secret_rotator.kinds.google_sa_key:GoogleSaKey"
external = "secret_rotator.kinds.external:External"

[tool.poetry]
packages = [{ include = "secret_rotator", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.10,<0.17.0)",
    "pytest-asyncio (>=1.0,<2)"
]
