[project]
name = "secret-rotator"
version = "0.1.0"
description = "Automated OpenBao secret rotation for the homelab"
authors = [{ name = "Pieter van Ginkel", email = "pvginkel@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pyyaml (>=6.0,<7)"]

[project.scripts]
secret-rotator = "secret_rotator.cli:main"

[tool.poetry]
packages = [{ include = "secret_rotator", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.10,<0.17.0)"
]
