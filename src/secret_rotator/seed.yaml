    grafanaDashboards.publish posts each repo's dashboards with it. Not the KubeCoder catalog's
    grafana-api-key, which is projected into dev environments."

jenkins/home-automation-fleet:
  kind: home-assistant-token
  interval: 14d
  activate: none

jenkins/iot-mqtt:
  kind: manual
  interval: never
  activate: none
  notes: "baked into flashed firmware with shared/wifi-iot"

jenkins/iotsupport-pipeline-oidc:
  kind: keycloak-client
  args: {"realm":"homelab"}
  interval: 14d
  activate: none

# To be deleted under ANS-229; the seed holds whether or not the store still has it.
jenkins/keycloak-da-admin:
  kind: keycloak-client
  args: {"realm":"homelab-dev"}
  interval: 14d
  activate: none

jenkins/keycloak-iotsupport-admin:
  kind: keycloak-client
  args: {"realm":"homelab-dev","client":"iotsupport-admin"}
  interval: 14d
  activate: none

jenkins/mydownloads-android-keystore:
  kind: manual
  interval: never
  activate: none
  notes: "keystore password, today the same personal password as the other Android keystore;
    re-keying is an operator project, not a copy relation"

jenkins/openai-ci-cd:
  kind: manual
  args: {"type":"openai-api-key"}
  interval: 365d
  activate: none
  notes: "DesignAssistant's UAT deploy job (Jenkinsfile.deploy-uat), which regenerates the canon
    derivatives."

jenkins/scantopdf-android-keystore:
  kind: manual
  interval: never
  activate: none
  notes: "keystore password, today the same personal password as the other Android keystore;
    re-keying is an operator project, not a copy relation"

jenkins/youtrack:
  kind: youtrack-token
  interval: 14d
  activate: none
  keys:
    webhook-token: {kind: "copy:eso/prd/youtrack/prd/webhook-token#token"}

# --- shared -----------------------------------------------------------------------------------

shared/dev/ceph-csi:
  kind: cephx
  interval: 365d
  activate: none
  keys:
    user_id: {kind: none}

shared/dev/ceph-rgw/s3:
  kind: rgw-admin
  interval: 365d
  activate: none
  keys:
    access_key_id: {kind: none}

shared/jenkins/admin-password:
  kind: manual
  interval: never
  activate: auto
  notes: "Not a password: the Jenkins admin account's API token OpenBao, which infra-statistics
    reads until it reads eso/prd/infra-statistics/prd/jenkins. The operator revokes it after that
    leaf's first rotation, then deletes this leaf (slice 047)."

shared/prd/ceph-csi:
  kind: cephx
  interval: 365d
  activate: none
  keys:
    user_id: {kind: none}

shared/prd/ceph-rgw/s3:
  kind: rgw-admin
  interval: 365d
  activate: none
  keys:
    access_key_id: {kind: none}

shared/samba/users:
  kind: samba-user
  interval: 365d
  activate: "eso,k8s-rollout,manual:set the new password in the Windows environments that mount the
    shares and restart the KubeCoder environments that mount them"
  keys:
    mvdbovenkamp:
      kind: manual
      interval: never
      notes: "another person's own password, not rotated on a schedule"

shared/wifi-iot:
  kind: external
  interval: 365d
  activate: none
  notes: "IoT Wi-Fi (SSID Thing-Fish), flashed into every device by IoTSupport. Add the new password
    on the router beside the old; write it to this key, where IoTSupport picks it up; let
    IoTSupport's device key rotation deliver it; check every device is on the new one; remove the
    old from the router. Re-provision by hand a device offline throughout. Two router passwords at
    once: unverified."

# --- rotator: the rotator's own leaves; the rotator and iac-impl read them at every run ---------

rotator/jenkins:
  kind: jenkins-token
  interval: 365d
  activate: none
  keys:
    user: {kind: none}

rotator/telegram:
  kind: manual
  args: {"type":"telegram-bot-token"}
  interval: 365d
  activate: none
  notes: "The Secret Rotator bot: posts in the Homelab Alerts group."

rotator/youtrack:
  kind: youtrack-token
  interval: 365d
  activate: none

# The keycloak-client kind's counterparts, one service-account client with manage-clients per
# realm, minted by the operator; each is rotated by the kind itself.
rotator/keycloak-client/homelab:
  kind: keycloak-client
  args: {"realm":"homelab"}
  interval: 365d
  activate: none

rotator/keycloak-client/homelab-dev:
  kind: keycloak-client
  args: {"realm":"homelab-dev"}
  interval: 365d
  activate: none

# OpenBao's own OIDC login client: the openbao role reads its secret from here, and its rotation
# writes it into auth/oidc/config.
rotator/oidc-auth-client:
  kind: keycloak-client
  args: {"realm":"homelab","client":"openbao","target":"auth/oidc/config"}
  interval: 14d
  activate: none

# Marker leaves for the AppRole secret_ids OpenBao does not keep in KV (R11).
rotator/approle/backup:
  marker: secret_id
  kind: approle
  args: {"role":"backup","delivery":"playbook"}
  interval: 14d
  activate: none

rotator/approle/eso:
  marker: secret_id
  kind: approle
  args: {"role":"eso","delivery":"k8s_secret=external-secrets-prd/openbao-eso-approle"}
  interval: 14d
  activate: k8s-rollout:external-secrets-prd/deployment/external-secrets-prd

rotator/approle/eso-dev:
  marker: secret_id
  kind: approle
  args: {"role":"eso-dev","delivery":"k8s_secret=external-secrets/openbao-eso-approle"}
  interval: never
  activate: none
  notes: "its Secret is on the dev cluster (off by default), which the rotator's prd ServiceAccount
    does not reach"

rotator/approle/iac-agent:
  marker: secret_id
  kind: approle
  args: {"role":"iac-agent","delivery":"manual=Paste it as OPENBAO_SECRET_ID in srviac /etc/iac/secrets.yaml"}
  interval: 90d
  activate: none

rotator/approle/jenkins:
  marker: secret_id
  kind: approle
  args: {"role":"jenkins","delivery":"jenkins_credential=724520d1-a0c1-4fa3-8a9e-a027de7f469a"}
  interval: 14d
  activate: none

rotator/approle/openbao-admin:
  marker: secret_id
  kind: approle
  args: {"role":"openbao-admin","delivery":"manual=Re-vault it as openbao_admin_secret_id in Ansible inventories/prd/group_vars/openbao.yml and commit"}
  interval: 90d
  activate: none

# Marker leaves for the bootstrap tier, rotated outside the tool by the procedure each one's notes
# name; the credential never enters OpenBao.
rotator/bootstrap/age-private-key:
  marker: age-private-key
  kind: external
  interval: 365d
  activate: none
  notes: "The bootstrap tier: the backups' age key, its private half in RoboForm only; rotated on
    compromise only, the old key kept until the backups encrypted to it age out. No procedure is
    written down (SOPs bootstrap-secrets-rotation.md)."

rotator/bootstrap/ansible-vault-passphrase:
  marker: ansible-vault-passphrase
  kind: external
  interval: 365d
  activate: none
  notes: "The bootstrap tier: the Ansible Vault passphrase. Rotate it by SOPs
    bootstrap-secrets-rotation.md §1, which also writes the KubeCoder prd catalog's
    ansible-vault-password."

rotator/bootstrap/git-api-token:
  marker: git-api-token
  kind: external
  interval: 365d
  activate: none
  notes: "The bootstrap tier: srviac's GIT_API_TOKEN, the PAT for TerraformState. Rotate it by SOPs
    bootstrap-secrets-rotation.md §3 (Ansible docs/runbooks/iac-agent.md, GIT_API_TOKEN)."

rotator/bootstrap/jenkins-agent-secret:
  marker: jenkins-agent-secret
  kind: external
  interval: 365d
  activate: none
  notes: "The bootstrap tier: srviac's Jenkins inbound-agent secret. Rotate it by SOPs
    bootstrap-secrets-rotation.md §4 (Ansible docs/runbooks/iac-agent.md, JENKINS_AGENT_SECRET)."

rotator/bootstrap/jwk-provisioner-password:
  marker: jwk-provisioner-password
  kind: external
  interval: 365d
  activate: none
  notes: "The bootstrap tier: step-ca's JWK provisioner password. Rotate it by SOPs
    bootstrap-secrets-rotation.md §2 (Ansible docs/runbooks/step-ca-bootstrap.md, JWK provisioner
    password rotation)."

rotator/bootstrap/seal-key:
  marker: seal-key
  kind: external
  interval: 365d
  activate: none
  notes: "The bootstrap tier: OpenBao's static seal key, rotated on compromise only (SOPs
    bootstrap-secrets-rotation.md). Its seal migration is sketched in Ansible
    docs/runbooks/openbao.md §5, Static seal key."
