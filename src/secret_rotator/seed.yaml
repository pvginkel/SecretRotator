    iotsupport-keycloak-admin-client-secret: {kind: "copy:jenkins/keycloak-iotsupport-admin#client_secret"}
    jenkins-mcp-token: {kind: "copy:eso/prd/jenkins-mcp/prd/config#bearer-token"}
    jenkins-token: {kind: jenkins-token, interval: 14d}
    jenkins-user: {kind: none}
    kubeconfig: {kind: k8s-sa-token}
    kubeconfig-dev-write: {kind: k8s-sa-token}
    kubeconfig-prd-write: {kind: k8s-sa-token}
    openai-api-key:
      args: {"type":"openai-api-key"}
      notes: "The environments whose manifest asks for it (NewsFilter, ElectronicsInventory,
        DesignAssistant), whose suites call the live API; the dev bag copies it."
    proxmox-password: {kind: "copy:iac/proxmox#password"}
    ssh-key-ansible: {kind: "copy:iac/ansible-ssh-key#private"}
    ssh-key-pve:
      args: {"type":"ssh-private-key"}
