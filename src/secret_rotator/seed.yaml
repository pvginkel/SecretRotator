        bootstrap-secrets-rotation.md §1, whose step 9 writes this key."
    argocd-token:
      args: {"type":"argocd-token"}
      notes: "Argo CD's local account kubecoder (role:readonly), for every prd environment: argocd
        account generate-token --account kubecoder, as admin (Ansible docs/runbooks/argocd.md)."
