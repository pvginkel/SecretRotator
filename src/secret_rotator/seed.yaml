# The rotation entries of every leaf of the kv mount, transcribed from AnsibleSpecs
# secret-rotation/catalog.md: a change to a catalog row is made here too. `secret-rotator annotate`
# writes them; `secret-rotator audit --keys store-keys.json` holds this seed to the contract
# offline, over the key names of every leaf the seed covers (store-keys.json beside it).
#
# A leaf is compact (design §5): a default of the entry's fields, and under `keys:` a key's own
# fields over the default's. annotate expands it into one rotation_<key> entry per data key: the
# default's kind on each key it may rotate, its other fields on each key whose kind takes them.
# args is a mapping, every other field a string; interval is absent only where every key is a copy
# or none. `marker: <key>` declares a marker leaf (catalog § rotator/), created with that one data
# key.
