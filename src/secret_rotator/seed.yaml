        its public half is Ansible ansible/files/pve.pub (comment pve-root); the Ansible environment
        writes it to ~/.ssh/id_ed25519_pve."
    tf-backend-age-public-key: {kind: "copy:iac/tf-backend#age_public_key"}
    tf-backend-age-secret-key: {kind: "copy:iac/tf-backend#age_secret_key"}
    trello-api-key: {kind: "copy:eso/prd/trello-mcp/prd/trello#api-key"}
