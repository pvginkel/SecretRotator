# The rotation annotations of every leaf of the kv mount, transcribed from AnsibleSpecs
# secret-rotation/catalog.md: a change to a catalog row is made here too. `secret-rotator annotate`
# writes them; `secret-rotator audit --keys store-keys.json` holds this seed to the contract
# offline, over the key names of every leaf the seed covers (store-keys.json beside it).
#
# Every value is a string. rotation_interval is absent only where every key is a copy or none.
# `marker: <key>` declares a marker leaf (catalog § rotator/), created with that one data key.
---

# --- eso/dev: the dev cluster is off by default; nothing is activated ------------------------

eso/dev/electronics-inventory/dev/oidc:
  rotation_mechanism: keycloak-client
  rotation_args: '{"realm":"homelab-dev"}'
  rotation_interval: 14d
  rotation_activate: none

